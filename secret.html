<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裏マーケット - Secret</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #5a0000; color: #ffffff; padding: 20px; text-align: center; }
        
        /* 1. المربعات الملونة الموجودة أعلى الصفحة فوق العنوان (بجانب بعضها) */
        .color-boxes-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .color-box {
            width: 35px;
            height: 25px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* تحديد الألوان الأربعة */
        .box-yellow { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .box-green  { background-color: #00ff66; box-shadow: 0 0 10px #00ff66; }
        .box-red    { background-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
        .box-purple { background-color: #9d00ff; box-shadow: 0 0 10px #9d00ff; }

        /* 2. العنوان الرئيسي الياباني */
        .title { 
            font-size: 24px; 
            font-weight: bold; 
            margin-bottom: 25px; 
            color: #ffffff; 
            letter-spacing: 2px; 
            border-bottom: 1px solid #880000;
            padding-bottom: 10px;
        }
        
        /* 3. شبكة الصور والمنتجات أسفل العنوان */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        
        .card { 
            background: #2a0000; 
            border: 1px solid #880000; 
            border-radius: 8px; 
            width: 160px; 
            padding: 10px; 
            text-align: center;
        }

        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; }
        .card h3 { font-size: 13px; color: #ffffff; margin-top: 8px; }
        .card p { font-size: 11px; color: #aaa; margin-top: 3px; }

        .back-btn { display: inline-block; margin-top: 30px; color: #ffffff; text-decoration: none; border: 1px solid #fff; padding: 8px 16px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. المربعات الملونة فوق العنوان بجانب بعضها -->
    <div class="color-boxes-top">
        <div class="color-box box-yellow"></div>
        <div class="color-box box-green"></div>
        <div class="color-box box-red"></div>
        <div class="color-box box-purple"></div>
    </div>

    <!-- 2. النص الياباني في المنتصف -->
    <div class="title">非公開コレクション</div>

    <!-- 3. الصور والبطاقات تحت النص -->
    <div class="container">
        <div class="card">
            <<img src="img_003.pug">¥100.000؛
            <h3>シークレット 01</h3>
            <p>PENDING</p>
        </div>

        <div class="card">
            <img src="images/secret1.jpg" alt="Item 2">
            <h3>シークレット 02</h3>
            <p>ONLINE</p>
        </div>

        <div class="card">
            <img src="images/secret1.jpg" alt="Item 3">
            <h3>シークレット 03</h3>
            <p>RESTRICTED</p>
        </div>

        <div class="card">
            <img src="images/secret1.jpg" alt="Item 4">
            <h3>シークレット 04</h3>
            <p>EXCLUSIVE</p>
        </div>
    </div>

    <br>
    <a href="index.html" class="back-btn">戻る</a>

</body>
</html>
