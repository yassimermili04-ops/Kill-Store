<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストア - Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding: 20px; text-align: center; }
        
        /* الشريط العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 2px solid #0056b3; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: #0056b3; } /* اسم المتجر كبير وأزرق */
        .cart-icon { font-size: 24px; cursor: pointer; } /* رمز السلة */
        
        /* شريط البحث */
        .search-box input { width: 80%; max-width: 350px; padding: 10px; border: 2px solid #0056b3; border-radius: 20px; font-size: 14px; text-align: center; outline: none; }
        
        /* بطاقات المنتجات */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 30px; }
        .card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 12px; width: 150px; padding: 10px; text-align: center; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 14px; color: #0056b3; margin-top: 8px; }
        .card p { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header">
        <div class="logo">オンラインストア</div> <!-- اسم المتجر كبير وأزرق باليابانية -->
        <div class="cart-icon">🛒</div> <!-- رمز السلة في الزاوية -->
    </div>

    <!-- شريط البحث السري -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="検索..." onkeyup="checkCode()">

    <!-- شبكة المنتجات العادية -->

            <h3>商品 A</h3>
            <p>日本語のテキスト</p>
        </div>

        function checkCode() {
            var input = document.getElementById("searchInput").value;
            // عند كتابة 1234 يتم الانتقال إلى الملف الثاني
            if (input === "1234") {

</body>
</html>
